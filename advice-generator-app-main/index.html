<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advice Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Bai+Jamjuree:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Karla:ital,wght@0,200..800;1,200..800&family=Manrope:wght@200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Raleway:ital,wght@0,100..900;1,100..900&family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap");

      :root {
        --Blue600: hsl(217, 19%, 38%);
        --Blue900: hsl(217, 19%, 24%);
        --Blue950: hsl(218, 23%, 16%);

        --Blue200: hsl(193, 38%, 86%);
        --Green300: hsl(150, 100%, 66%);
      }
    </style>
  </head>

  <body
    class="bg-[var(--Blue950)] flex items-center justify-center min-h-screen px-4"
  >
    <!-- Card -->
    <div
      class="bg-[var(--Blue900)] text-center rounded-xl p-6 md:p-10 max-w-md w-full relative shadow-lg"
    >
      <!-- Advice ID -->
      <p id="advice-id" class="text-[var(--Green300)] text-xs mb-4">ADVICE #117</p>

      <!-- Advice Text -->
      <h1 id="advice-text" class="text-[var(--Blue200)] text-lg md:text-xl font-semibold">
        “It is easy to sit up and take notice, what's difficult is getting up
        and taking action.”
      </h1>

      <!-- Divider -->
      <div class="flex items-center justify-center my-6">
        <div class="flex gap-1 mx-4">
          <img src="./images/pattern-divider-desktop.svg" alt="" />
        </div>
      </div>

      <!-- Dice Button -->
      <button 
        class="absolute left-1/2 -bottom-6 -translate-x-1/2 bg-[var(--Green300)] p-4 rounded-full hover:shadow-[0_0_25px_var(--Green300)] transition"
      >
        <img src="./images/icon-dice.svg" alt="" />
      </button>
    </div>

    <script src="/advice-generator-app-main/main.js"></script>
  </body>
</html>
